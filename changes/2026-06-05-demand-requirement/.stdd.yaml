change:
  name: demand-requirement
  date: '2026-06-05'
  title: 诉求 + 需求 + M2M 关联 (rainier_demand / rainier_requirement / rainier_demand_requirement)
  source_doc: A-角色意图卡片.md  # §4.1 卡片 2-3 (PO / 业务方)
  follows_up:
    - 2026-06-04-org-tree-and-employee (uses rainier_user as FK target)
    - 2026-06-04-add-language-standards (uses .stdd/standards/{java,typescript}.md)

phase:
  current: suspended
status: paused_pending_revision   # dependency unblocked; awaiting user resume
paused_at: '2026-06-05'
unblocked_at: '2026-06-05'        # 2026-06-05-v1-id-migration delivered
paused_reason: |
  User reversed the v1 id-strategy decision after Phase 1. v1 tables migrated
  to BIGINT AUTO_INCREMENT by 2026-06-05-v1-id-migration (delivered as
  v0.0.4-id-migration). On resume, the proposal here MUST be revised to drop
  the dual BaseEntity / BaseAutoIdEntity design (single BaseEntity world now)
  and the cross-generation FK varchar(32) section is no longer needed.
blocks_on: []   # unblocked
revision_required_on_resume:
  - drop BaseAutoIdEntity (use single BaseEntity)
  - cross_generation_fk section → DELETE (all FKs are BIGINT now)
  - id_strategy_change section → simplify to "all new tables = BIGINT IDENTITY (per v0.0.4 standard)"
  - re-run Phase 1 Gate 1 with revised proposal

phase_orig:
  current: understand
  understand:
    status: completed
    confirmed_at: '2026-06-05'
    artifact: proposal.md
  spec:
    status: pending
  slice:
    status: pending
  build:
    status: pending
  verify:
    status: pending
  deliver:
    status: pending

scope:
  type: domain-entity
  entities:
    - rainier_demand
    - rainier_requirement
    - rainier_demand_requirement
  capabilities_modified:
    - frontend-scaffold      # Sider menu + /pm/* routes
    - backend-scaffold       # BaseAutoIdEntity added (BaseEntity unchanged)
  capabilities_new:
    - entity-demand
    - entity-requirement
    - entity-demand-requirement
    - workflow-demand-conversion
  explicitly_excluded:
    - project-entity
    - epic-story-task-entities
    - real-ai-classification
    - real-source-integration  # wechat/email/dingtalk
    - business-stakeholder-simplified-ui
    - status-auto-transition
    - requirement-code-auto-generation
    - acceptance-workflow-tables
    - v1-id-type-migration  # v1 stays varchar(32) UUID

id_strategy_change:
  before: varchar(32) UUID hex (Hibernate UUIDHexGenerator)
  after_for_new_tables: BIGINT AUTO_INCREMENT (JPA @GeneratedValue IDENTITY)
  rationale: User decision in Phase 1; numeric ids are simpler for UI/URL/admin display
  v1_tables_unchanged: true
  cross_generation_fk:
    - column: rainier_demand.submitter_user_id
      type: VARCHAR(32)
      references: rainier_user(id)  # v1 table
    - column: rainier_requirement.owner_user_id
      type: VARCHAR(32)
      references: rainier_user(id)

base_classes:
  v1: com.rainier.common.persistence.BaseEntity         # String UUID id, unchanged
  v2: com.rainier.common.persistence.BaseAutoIdEntity   # Long IDENTITY id, NEW
  audit_fields_shared: [create_by, create_time, update_by, update_time, del_flag]
