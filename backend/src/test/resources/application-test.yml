# Test profile.
# - H2 in-memory database in MySQL compatibility mode.
# - Hibernate generates schema from entities (ddl-auto=create-drop).
# - Flyway is DISABLED in tests; the V1__init_org.sql migration is only exercised by the
#   docker-compose E2E (real MySQL) to avoid H2↔MySQL DDL incompatibility.
# - Auditor returns "system" (see AuditorAwareImpl) because tests run unauthenticated.
spring:
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:rainier;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  security:
    # v0.0.21: admin authz OFF in the default test profile so the ~39 legacy admin controller tests
    # run unauthenticated unchanged. AdminAuthorizationTest / AdminAuthzBootstrapTest flip it on via
    # @TestPropertySource. The bootstrap runner is also gated on this, so it no-ops in tests.
    admin-authz:
      enabled: false
    # v0.0.27: identity baseline OFF in the default test profile so the legacy unauthenticated
    # mockMvc tests stay green. AuthBaselineTest flips it on via @TestPropertySource.
    require-all-users-token:
      enabled: false
    # v0.0.38: real auth OFF in the default test profile so the legacy "any password" login tests stay
    # green. RealAuthLoginTest flips it on via @TestPropertySource.
    real-auth:
      enabled: false
  # v0.0.43: AI work log seed OFF in the default test profile so tests get a clean rainier_ai_work_log
  # table; the dedicated AiWorkLogSeedTest flips it on via @TestPropertySource.
  demo:
    ai-work-log-seed:
      enabled: false
    # v0.0.66: event seed OFF in the default test profile so tests get a clean rainier_event table.
    event-seed:
      enabled: false

rainier:
  product-module:
    depth:
      # Keep in sync with application.yml — tests assert the "4 > 3" boundary message.
      max: 3

logging:
  level:
    root: WARN
    com.rainier: INFO
