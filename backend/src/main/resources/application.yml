spring:
  application:
    name: rainier
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      # v0.0.91 D3 — cap artifact upload size at 10MB (per-file & total request).
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      # NOTE (Adjustment): Flyway 8.5.13 (Spring Boot 2.7-managed) rejects MySQL 8 with
      # "Unsupported Database" under its community edition; upgrading to Flyway 9 requires
      # Java 11. v0 of this change therefore disables Flyway and lets Hibernate generate
      # the schema via ddl-auto=update. The V1__init_org.sql migration is kept on disk as
      # documentation of the intended schema and as the starting point for the future
      # JDK 17 + Flyway re-enable. See pending-adjustments.md.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

server:
  port: 8080

rainier:
  product-module:
    depth:
      # v0.0.13: max nesting depth of the ProductModule self-FK tree (root = 1).
      max: 3

app:
  security:
    jwt:
      # DO NOT USE IN PROD — replace via SPRING env override.
      secret: "rainier-dev-only-jwt-secret-must-be-at-least-256-bits-long-changeme-changeme"
      expiration-hours: 24
    # v0.0.21: gate admin endpoints (token + elevation). Disabled in the test profile so legacy
    # admin controller tests run unauthenticated; the dedicated AdminAuthorizationTest flips it on.
    admin-authz:
      enabled: true
    # On startup, if NO role has adminAccess=true, elevate this role code so the system isn't
    # locked out (granting the first admin via PUT /api/roles would itself need admin).
    bootstrap-admin-role: PMO
    # v0.0.77 B4: fine-grained @RequiresPermission enforcement. Defaults to true; before v0.0.105
    # this was never actually enabled in prod because admin roles had no PermissionPoint pre-bound
    # → admin self-lock. AdminPermissionBootstrap (G1) now seeds all enum values onto every admin
    # role at startup, making it safe to keep this ON.
    fine-grained-permissions:
      enabled: true
    # v0.0.105 G1: pre-bind every PermissionPoint enum value to every adminAccess=true Role at
    # startup. Idempotent (existsByRoleIdAndPermissionPoint). Disabled in the test profile so the
    # 870+ existing tests get a clean rainier_role_permission table; AdminPermissionBootstrapTest
    # flips it on via @TestPropertySource.
    admin-permission-bootstrap:
      enabled: true
    # v0.0.27: require a valid Bearer token on ALL /api/** (identity baseline), not just /api/auth/me.
    # Whitelist: POST /api/auth/login + GET /api/health. Disabled in the test profile so the legacy
    # unauthenticated mockMvc tests stay green; AuthBaselineTest flips it on.
    require-all-users-token:
      enabled: true
    # v0.0.38: real credential verification at login (BCrypt). When true, login looks up the user and
    # verifies the password; unknown user / wrong password → 401. Disabled in the test profile so the
    # legacy "any password" login tests stay green; RealAuthLoginTest flips it on.
    real-auth:
      enabled: true
    # Default password backfilled to password-less users at startup (when real-auth is on) so existing
    # accounts can log in. CHANGE in prod via SPRING env override.
    default-password: rainier123
  cors:
    # Comma-separated list bound to List&lt;String&gt; in CorsConfig via Spring's default converter.
    allowed-origins: "http://localhost:5173,http://localhost"
  demo:
    # v0.0.43: seed a few PROPOSED AI work logs on startup when the table is empty (flywheel shell demo
    # data, no real AI). Disabled in the test profile so tests get a clean rainier_ai_work_log table.
    ai-work-log-seed:
      enabled: true
    # v0.0.66: seed 5 sample events (one per source type) on startup when rainier_event is empty
    # so the flywheel pipeline demo has data. Disabled in test profile.
    event-seed:
      enabled: true
    # v0.0.85 (C5): seed 10 common capability tags (TECH / PRODUCT / SOFT) when
    # rainier_capability_tag is empty so the「我的档案」能力栏目 has data. Disabled in test profile.
    capability-seed:
      enabled: true
  # v0.0.91 (D3): file storage backend for artifact attachments. kind=local → LocalFsFileStorage,
  # kind=s3 → S3FileStorageStub (throws UnsupportedOperationException; SDK 接入留给后续). Default
  # is local (matchIfMissing=true on the impl).
  storage:
    kind: local
    local:
      root: ./.storage/files
  # v0.0.101 F2 — shared secret echoed by GitLab in the X-Gitlab-Token header on every webhook
  # delivery. CHANGE in prod via SPRING env override; the controller does a constant-time compare.
  gitlab:
    webhook-secret: changeme

logging:
  level:
    root: INFO
    com.rainier: DEBUG
