  v0_0_8_1: 'DanglingProjectIdCleanup @Order + FOR UPDATE; ProjectService PUT description full-replace; form error feedback'

design_decisions_pre_locked:
  story_anchor: |
    Story MUST be anchored to a Requirement (NN FK). No "free-floating" Stories
    at Project-level. Keeps the Demand → Requirement → Story narrative pure.
  acceptance_criteria_field: |
    Independent `acceptance_criteria` VARCHAR(4000) column, parallel to
    description. PM / test validation reads it directly; no need to scan the
    free-form description block.
  status_machine: |
    6-state: DRAFT / READY / IN_PROGRESS / DONE / BLOCKED / CANCELLED.
    BLOCKED is a first-class state (not a closeReason) because the blueprint
    flywheel ② risk radar will surface BLOCKED Stories as a signal class.
  project_id_inheritance: |
    Story.projectId is NOT exposed on the create DTO. StoryService.create reads
    the parent Requirement.projectId and copies it into Story.projectId. Story
    has its own column (not a join-at-read) for query / index efficiency.
    Subsequent change to Requirement.projectId does NOT cascade — consistency
    is repaired by the existing DanglingProjectIdCleanup family pattern (when
    we eventually add StoryProjectId self-heal in a later change).
  soft_delete: |
    @SQLDelete + del_flag, same family as Project / Requirement / Demand /
    Organization.
  owner_mutability: |
    Inherits v0.0.8 Decision 6b: ownerUserId is mutable; service validates
    new owner exists. createBy / updateBy capture transfers via
    AuditorAwareImpl.
  frontend_shape: |
    RequirementsPage drilldown ONLY in this change. Each Requirement row
    expandable to reveal its Stories sub-table with new/edit/delete drawer.
    No independent Sider "故事" menu item (deferred to v0.1.x cross-Requirement
    workbench).
  default_sort: |
    createTime DESC. No sort_order column in this change. PO can rely on
    priority enumeration for now; drag-and-drop sort is a deferred change.

