tech_stack:
  backend:
    language: java
    language_version: '1.8'
    framework: spring-boot
    framework_version: 2.7.18
    build_tool: maven
    db: mysql
    db_version: '8.0'
    auth_library: jjwt-0.11.x
    test_libs:
      - junit-jupiter
      - assertj
      - mockito
      - spring-boot-test
      - h2
  frontend:
    language: typescript
    language_version: '5'
    framework: react
    framework_version: '18'
    bundler: vite
    bundler_version: '5'
    router: react-router-6
    state: zustand
    http: axios
    ui_theme: feishu-style
    primary_color: '#3370FF'
    test_libs:
      - vitest
      - react-testing-library
      - jsdom
      - msw

long_range:
  enabled: true
  mode: full_auto
  pre_auth_completed: true
  pre_auth_timestamp: '2026-06-02'
  pre_auth:
    design_deviation:
      minor: auto_record
      major: auto_record_continue
    technical_blocker:
      strategy: workaround
    iteration:
      max_rounds: 10
      on_cap: report_in_summary
    operations:
      directory: allow
      file_write: allow
      command_exec: allow
      script_exec: allow
      network: allow
      file_read: allow
      git_readonly: allow
    gate3: mandatory
  degradation:
    max_consecutive_failures: 3
    pass_rate_threshold: 0.95
    safety_check: true
  settings_file: .claude/settings.local.json

scope:
  depth: minimal-scaffold
  includes:
    - backend-scaffold
    - frontend-scaffold
    - health-check
    - auth-placeholder
    - dev-runtime
    - test-runtime
  excludes:
    - business-domain-entities
    - real-idp-integration
    - llm-integration
    - external-tool-integrations
    - ui-component-library
