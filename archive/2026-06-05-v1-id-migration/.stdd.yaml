id_strategy:
  before:
    java: 'private String id'
    generator: 'org.hibernate.id.UUIDHexGenerator (32-char hex, no dashes)'
    sql: 'VARCHAR(32) NOT NULL'
    ts: 'id: string'
  after:
    java: 'private Long id'
    generator: '@GeneratedValue(strategy = GenerationType.IDENTITY)'
    sql: 'BIGINT NOT NULL AUTO_INCREMENT'
    ts: 'id: number'

long_range:
  enabled: true
  mode: full_auto
  pre_auth_completed: true
  pre_auth_timestamp: '2026-06-05'
  pre_auth:
    design_deviation:
      minor: auto_record
      major: auto_record_continue
    technical_blocker:
      strategy: workaround
    iteration:
      max_rounds: 10
      on_cap: report_in_summary
    operations:
      directory: allow
      file_write: allow
      command_exec: allow
      script_exec: allow
      network: allow
      file_read: allow
      git_readonly: allow
    gate3: mandatory
  degradation:
    max_consecutive_failures: 3
    pass_rate_threshold: 0.95
    safety_check: true
  settings_file: .claude/settings.local.json  # already configured in v0/v1

data_strategy:
  approach: wipe-and-rebuild
  command: 'docker compose down -v && docker compose up -d --build'
  reason: 'v0 phase, no production data; one E2E row + manual UI test rows acceptable to lose'
  preserves_data: false

unchanged:
  - createBy / updateBy fields remain String (mock JWT username, not numeric id)
  - frontend api/client.ts / store/auth.ts
  - v0 entities (auth/health/Login/Home)
  - backend pom.xml / application*.yml
  - docker-compose.yml
  - archive/2026-06-04-org-tree-and-employee/**
