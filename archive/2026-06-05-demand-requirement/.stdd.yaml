id_strategy:
  approach: all-tables-bigint-identity   # established in v0.0.4
  rationale: 'Single uniform standard; no dual-base-class complexity'
  base_class: com.rainier.common.persistence.BaseEntity
  fk_types:
    submitter_user_id: BIGINT
    owner_user_id: BIGINT
    demand_id: BIGINT
    requirement_id: BIGINT
    ai_duplicate_hint: BIGINT  # self-ref, no FK constraint

long_range:
  enabled: true
  mode: full_auto
  pre_auth_completed: true
  pre_auth_timestamp: '2026-06-05'
  pre_auth:
    design_deviation:
      minor: auto_record
      major: auto_record_continue
    technical_blocker:
      strategy: workaround
    iteration:
      max_rounds: 10
      on_cap: report_in_summary
    operations:
      directory: allow
      file_write: allow
      command_exec: allow
      script_exec: allow
      network: allow
      file_read: allow
      git_readonly: allow
    gate3: mandatory
  degradation:
    max_consecutive_failures: 3
    pass_rate_threshold: 0.95
    safety_check: true
  settings_file: .claude/settings.local.json  # already configured in v0.0.3..v0.0.5

