boundary_decisions:
  add_owner_as_member: 400_already_owner
  on_owner_change_legacy_owner: not_auto_added

scope:
  type: feature
  capabilities_modified: [entity-project, frontend-scaffold, me-inbox]
  capabilities_new: [entity-project-member, entity-organization-pmo]
  new_tables: 2
  new_columns: [rainier_project.pmo_user_id]
  new_deps: []
  new_apis:
    - "GET/POST/DELETE /api/organizations/{id}/pmos"
    - "GET /api/organizations/{id}/effective-pmos"
    - "GET/POST/PUT/DELETE /api/projects/{id}/members[/{userId}]"
  behavior_change: "项目创建注入团队/PMO 默认值；项目成员含 role(PD/DEV/QA/DESIGN/BIZ/OPS/OTHER)；PMO 沿 org parent 链继承"

design_decisions:
  pmo_per_org: many-to-many  # 1:N，新表 organization_pmo，不复用 user_role
  owner_in_member_table: false  # owner 不冗余写入；查询时 UNION
  default_value_injection: backend  # 后端注入，前端只显示
  pmo_inheritance: read_time  # 读时计算（沿 parent 链 UNION），不写入下级
  pmo_admin_ui_location: organization_edit_drawer  # 不开独立 OrganizationDetailPage
  project_member_role_enum: [PD, DEV, QA, DESIGN, BIZ, OPS, OTHER]  # 不含 PM（项目经理本质 = owner）
  member_permission_check: dual  # 前端 hide button + 后端 403
