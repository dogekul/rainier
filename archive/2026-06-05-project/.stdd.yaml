baselines_preserved:
  v0_0_3: 'User / Organization / UserOrganization (UO.role=HEAD/MEMBER unchanged)'
  v0_0_4: 'all v1 entities BIGINT IDENTITY; single BaseEntity'
  v0_0_5: 'Organization has NO isPmo field'
  v0_0_6: 'demand / requirement / demand_requirement intact; Requirement.project_id retrofitted'
  v0_0_7: 'position / role / user_role intact; User.position_id intact; UserRole.project_id retrofitted'

design_decisions_pre_locked:
  project_role_modeling: |
    All project-dimensional role hats (PM/PMO/TechLead/QA Lead/Architect/...) live
    in UserRole M2M (user × role × project). Project entity holds ONLY owner_user_id
    (the project lead / creator, an entity-essential attribute, not a hat).
  owner_mutability: |
    BOTH Project.owner_user_id AND Requirement.owner_user_id are mutable in v0.0.8.
    The v0.0.6 "Requirement.owner immutable" rule is reversed by Decision 6b — admin
    may transfer ownership (e.g. PO handoff) without recreating the entity. Project
    lifecycles are long, Requirement lifecycles can be too. Service validates new
    ownerUserId exists. createBy/updateBy audit trail captures who did the change.
  ownership_resolution: |
    ownerUserId is a business field on the DTO (admin-selected, required).
    NOT auto-derived from JWT username. JWT is only for createBy/updateBy audit
    fields (AuditorAwareImpl handles those, unchanged).
    Frontend defaults the dropdown to current logged-in user's id by matching
    loginName against the listUsers result; admin can change to any other user.
  dirty_data_strategy: |
    Decision 6 "启动自愈" (startup self-heal). A @Component CommandLineRunner
    `DanglingProjectIdCleanup` scans rainier_requirement and rainier_user_role on
    every backend boot; rows whose project_id does NOT match a live (del_flag=0)
    rainier_project.id are NULL'd via native UPDATE within a @Transactional
    boundary. Each row cleared emits a WARN line tagged with table.id and the
    old project_id value. Writes (POST/PUT) are strict from v0.0.8 onward
    (404 → 400 "project not found"). Reads can therefore assume no dangling refs.
    The known v0.0.7 dirty row (user_role.id=2 projectId=42) is cleared on the
    first v0.0.8 boot — verified in E2E by docker logs grep.
  schema_change_policy: |
    No new columns added. v0.0.6 Requirement.project_id and v0.0.7 UserRole.project_id
    are the activation targets — they already exist as BIGINT NULL placeholders.
  docker_strategy: |
    No docker compose down -v. Hibernate ddl-auto=update adds rainier_project table
    without touching existing 9 tables. Frontend container rebuild + recreate only.
