long_range:
  enabled: true
  mode: full_auto
  pre_auth_completed: true
  pre_auth_timestamp: '2026-06-04'
  pre_auth:
    design_deviation:
      minor: auto_record
      major: auto_record_continue
    technical_blocker:
      strategy: workaround
    iteration:
      max_rounds: 10
      on_cap: report_in_summary
    operations:
      directory: allow
      file_write: allow
      command_exec: allow
      script_exec: allow
      network: allow
      file_read: allow
      git_readonly: allow
    gate3: mandatory
  degradation:
    max_consecutive_failures: 3
    pass_rate_threshold: 0.95
    safety_check: true
  settings_file: .claude/settings.local.json  # 已在 v0 bootstrap 时配置

scope:
  type: domain-entity-with-infrastructure
  entities:
    - rainier_organization
    - rainier_user
    - rainier_user_organization
  capabilities_modified:
    - backend-scaffold
    - frontend-scaffold
    - dev-runtime
    - test-runtime
  capabilities_new:
    - entity-organization
    - entity-user
    - entity-user-organization
    - pagination-envelope
  explicitly_excluded:
    - password / salt           # mock JWT 阶段不接 IdP
    - manager_user_id           # 直属主管，靠 user_organization.role=HEAD 表达
    - is_leader / leader_mode   # 高管标识，靠分配到 type=COMPANY 表达
    - post_desc / position_tag  # 岗位字段表，留下一个变更
    - skill_labels / skill_tag  # 技能标签表，留下一个变更
    - image / hire_date / gender / birthday / phone  # 个人隐私 + 非必要
    - org manager CSV           # 方案 A: 用 user_organization.role 代替
    - 高管 office 专表          # 用 type=COMPANY + role=HEAD 间接表达
    - 软删恢复接口              # 接口管理员后续切片

infrastructure_impact:
  persistence:
    introduces: [jpa, flyway, mysql-connector-j]
    id_strategy: hibernate-uuid-hex-generator
    id_column_type: varchar(32)
    test_db: h2-in-memory
    dev_db: mysql-8-via-docker-compose
    migration_strategy: flyway (dev) + ddl-auto=create-drop (test)
    soft_delete_pattern: "@SQLDelete + @Where on all entities; logical delete via del_flag column"

schema_design:
  table_prefix: rainier_
  tables:
    - name: rainier_organization
      fields_total: 15
      tree: self-referential adjacency list
      cache: path + whole_name (service-maintained)
      type_values: [COMPANY, DEPARTMENT, DOMAIN, TEAM, SUBGROUP]
      pmo_marker: is_pmo
      type_enforcement: soft (service-layer warning)
    - name: rainier_user
      fields_total: 12
      executive_marker: indirect (via assignment to type=COMPANY)
    - name: rainier_user_organization
      fields_total: 11
      role_values: [MEMBER, HEAD]
      primary_uniqueness: service-layer guard + optimistic lock
      history_field: left_at  # null = active
