  v0_0_3: 'User / Organization / UserOrganization'
  v0_0_4: 'all v1 entities BIGINT IDENTITY; single BaseEntity'
  v0_0_5: 'Organization has NO isPmo field'
  v0_0_6: 'demand / requirement / demand_requirement intact'
  v0_0_7: 'position / role / user_role intact'
  v0_0_8: 'project + Requirement.project_id activation + owner mutable'
  v0_0_8_1: 'DanglingProjectIdCleanup hardening + PUT semantics'
  v0_0_9: 'story entity + Requirement.storyCount enrichment + drilldown'

design_decisions_pre_locked:
  timing: |
    v0.0.9-story Phase 6 DELIVER must complete (archive + merge specs + commit + tag
    v0.0.9-story) before this change starts. v0.0.10 source paths reference Story
    files from v0.0.9.
  sprint_semantics: |
    Sprint is a HIERARCHICAL grouping (Requirement decomposition layer), NOT an
    agile time-box. Service does NOT enforce start_date ≤ end_date or any time
    coherence. The date / goal fields are reference metadata only.
  story_sprint_mandatory: |
    Story.sprintId is NOT NULL. Story cannot float free of a Sprint. The legacy
    v0.0.9 Story.requirementId column stays in DB (ddl-auto=update never drops
    columns) but is removed from the Java entity / DTO / Service code path.
  sprint_field_set: |
    code (UNIQUE service-level) / name / description / goal VARCHAR(2000) /
    status VARCHAR(16) / requirement_id BIGINT NN / owner_user_id BIGINT NN /
    start_date DATE NULL / end_date DATE NULL + 6 audit + del_flag.
  story_requirement_id_removal: |
    Story.requirementId column is intentionally orphaned. New code paths reach
    Requirement via sprint.requirementId. A separate v0.0.11+ change will
    DROP COLUMN rainier_story.requirement_id once long-tail readers are confirmed
    absent.
  sprint_status_machine: |
    4-state: PLANNING / ACTIVE / COMPLETED / CANCELLED. No state transition
    guards in v0.0.10 (parallels Story v0.0.9 design decision 8).
  frontend_shape: |
    Two-page split: /pm/requirements drilldown shows Sprints (SprintListPanel);
    /pm/sprints (new menu item + page) shows Sprint CRUD with drilldown to Stories
    (reuses v0.0.9 StoryListPanel). StoryEditDrawer's locked-display swaps from
    Requirement to Sprint.
  legacy_migration: |
    LegacyStoryToSprintMigration @Component @Order(HIGHEST_PRECEDENCE) +
    @Transactional. Scans rainier_story.sprint_id IS NULL rows; groups by
    requirement_id; for each group creates Sprint(code="SPRINT-DEFAULT-<reqCode>",
    name="默认 Sprint", status=ACTIVE, owner=requirement.owner) and assigns its
    Story.sprint_id. Idempotent: subsequent boots find 0 rows and exit early.
    Parallels v0.0.8 DanglingProjectIdCleanup.

long_range:
